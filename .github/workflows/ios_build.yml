name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, x86_64-apple-ios

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version ^2.0.0

      - name: Generate Rust Bindings
        working-directory: ./ui
        run: flutter_rust_bridge_codegen generate

      - name: Install Dependencies
        working-directory: ./ui
        run: flutter pub get

      - name: Build iOS Application
        working-directory: ./ui
        run: |
          flutter build ios --release --no-codesign || true
          find build -name "Runner.app" -type d

      - name: Package IPA
        working-directory: ./ui
        run: |
          APP_PATH=$(find build -name "Runner.app" -type d | grep -E "iphoneos|Release" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          fi
          echo "Found app bundle at: $APP_PATH"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Runner.app not found!"
            exit 1
          fi
          mkdir -p build/ios/ipa/Payload
          cp -r "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r Mesh_UI_Release.ipa Payload
          ls -lh Mesh_UI_Release.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mesh-UI-iOS-IPA
          path: ui/build/ios/ipa/Mesh_UI_Release.ipa
