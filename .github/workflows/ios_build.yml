name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, x86_64-apple-ios

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version ^2.0.0

      - name: Generate Rust Bindings
        working-directory: ./ui
        run: flutter_rust_bridge_codegen generate

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        working-directory: ./ui
        run: flutter pub get

      - name: Build iOS Application
        working-directory: ./ui
        run: |
          flutter build ios --release --no-codesign --config-only || true
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS="arm64" \
            -derivedDataPath ../build/DerivedData \
            build

      - name: Package IPA
        working-directory: ./ui
        run: |
          APP_PATH=""
          for dir in $(find build -name "Runner.app" -type d); do
            if [ -f "$dir/Info.plist" ] && [ -f "$dir/Runner" ]; then
              APP_PATH="$dir"
              break
            fi
          done
          echo "Found valid app bundle at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Valid Runner.app with executable was not found!"
            exit 1
          fi
          ls -la "$APP_PATH"
          mkdir -p build/ios/ipa/Payload
          cp -r "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r Mesh_UI_Release.ipa Payload
          ls -lh Mesh_UI_Release.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mesh-UI-iOS-IPA
          path: ui/build/ios/ipa/Mesh_UI_Release.ipa
