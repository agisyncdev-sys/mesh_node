name: mesh_ui
description: Multi-platform UI for Decentralized AI Mesh Node
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # FFI Bindings
  flutter_rust_bridge: 2.12.0
  ffi: ^2.1.2
  rust_lib_mesh_ui:
    path: rust_builder
  dio: ^5.11.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  integration_test:
    sdk: flutter
  msix: ^3.18.0

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon.png"
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/models/

msix:
  display_name: Mesh UI
  publisher_display_name: Antigravity
  identity_name: com.antigravity.mesh.ui
  msix_version: 1.0.0.0